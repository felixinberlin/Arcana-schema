name: Schema CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests (Schema, JSON-LD, Render, Meta-Validation, Compatibility)
        run: npm test

      - name: Verify breaking changes
        run: npx tsx scripts/check-breaking.ts

      - name: Verify Draft-7 generation
        run: npx tsx scripts/generate-draft7.ts
